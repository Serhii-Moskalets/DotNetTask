name: .NET Core CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Enforce PR source branch (main only from dev)
      if: github.base_ref == 'main' && github.head_ref != 'dev'
      run: |
        echo "ERROR: Merging into 'main' is only allowed from the 'dev' branch."
        echo "Current source branch: ${{ github.head_ref }}"
        exit 1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Backend/

    - name: Build
      run: dotnet build Backend/ --no-restore

    - name: Test
      env:
        EmailSettings__Host: "smtp.gmail.com"
        EmailSettings__Port: 587
        EmailSettings__FromEmail: "monsters.inc.verif@gmail.com"
        EmailSettings__FromName: "To-Do App"
        EmailSettings__UserName: "monsters.inc.verif@gmail.com"
        EmailSettings__Password: ${{ secrets.EMAIL_PASSWORD }}
        EmailSettings__EnableSsl: "true"

        JwtSettings__Secret: ${{ secrets.JWT_SECRET }}
        JwtSettings__Issuer: "TodoListApp"
        JwtSettings__Audience: "TodoListApp-Users"
        JwtSettings__ExpiryMinutes: 60
      run: dotnet test Backend/ --no-build --verbosity normal
